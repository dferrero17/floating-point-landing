<style>
:root {
  --paper:    #f5f3ee;
  --mist:     #e8e5dd;
  --fog:      #9a9a9e;
  --ink-soft: #2a2730;
  --ink:      #15141a;
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--paper);
  color: var(--ink-soft);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; transition: opacity 180ms var(--ease); }
a:hover { opacity: 0.6; }

.fp-util, .fp-section__util {

  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fog);
}

.fp-lockup {
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: 26px;
  letter-spacing: -0.038em;
  color: var(--ink);

  white-space: nowrap;
}
.fp-lockup__dot { color: var(--ink); }
.fp-lockup--small { font-size: 22px; }

.fp-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--paper);
  transition: border-color 180ms var(--ease);
  border-bottom: 1px solid transparent;
}
.fp-header.is-scrolled { border-bottom-color: var(--mist); }
.fp-header__inner {
  max-width: 1280px;
  margin: 0 auto;
  padding: 20px 48px;
  display: flex;
  align-items: center;
  gap: 48px;
}
.fp-nav { display: flex; gap: 28px; margin-left: auto; }
.fp-nav__link {
  font-size: 14px;
  color: var(--ink-soft);
  position: relative;
}
.fp-nav__link.is-current { color: var(--ink); }
.fp-nav__link.is-current::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -6px;
  height: 1px;
  background: var(--ink);
}

.fp-cta {
  display: inline-block;
  font-family: var(--font-sans);
  font-size: 14px;
  background: var(--ink);
  color: var(--paper);
  padding: 12px 18px;
  border: none;
  cursor: pointer;
  letter-spacing: -0.005em;
  transition: background 180ms var(--ease);
}
.fp-cta:hover { background: var(--ink-soft); opacity: 1; }
.fp-cta--ghost {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--ink);
}
.fp-cta--ghost:hover { background: var(--ink); color: var(--paper); }

.fp-link {
  font-size: 14px;
  color: var(--ink);
  border-bottom: 1px solid var(--ink);
  padding-bottom: 2px;
}

.fp-hero {
  max-width: 1280px;
  margin: 0 auto;
  padding: 96px 48px 128px;
}
.fp-hero__util { margin-bottom: 32px; }
.fp-hero__headline {
  font-family: var(--font-sans);
  font-weight: 600;
  font-size: clamp(56px, 9vw, 128px);
  line-height: 0.98;
  letter-spacing: -0.038em;
  color: var(--ink);
  margin: 0 0 32px 0;
  max-width: 1100px;
}
.fp-hero__lockup {
  display: inline-flex;
  align-items: baseline;
}
.fp-hero__word {
  font: inherit;
  white-space: nowrap;
  line-height: 1;
}
.fp-hero__period-bouncer {
  display: inline-block;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--ink);
  transform-origin: 50% 100%;
  will-change: transform, opacity;
  pointer-events: none;
}
.fp-hero__lead {
  font-size: 19px;
  line-height: 1.5;
  color: var(--ink-soft);
  max-width: 620px;
  margin: 0 0 32px 0;
}
.fp-hero__actions { display: flex; align-items: center; gap: 24px; }

.fp-section__header {

}
.fp-section__util { display: block; margin-bottom: 12px; }
.fp-section__heading {

.fp-person__name { font-size: 15px; color: var(--paper); }

.fp-contact { padding: 128px 0; }

.fp-field { display: flex; flex-direction: column; gap: 6px; }
.fp-field label {

.fp-contact__done-lead {

.fp-footer {

.fp-footer__inner {

  margin: 0 auto;

.fp-footer__col { display: flex; flex-direction: column; gap: 8px; }

.fp-footer__util {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--fog);

}
.fp-footer__tag {
  font-size: 14px;
  color: var(--ink-soft);

}
.fp-footer__rule {
  max-width: 1280px;
  margin: 48px auto 24px;

}
.fp-footer__base {

}

}
.fp-modal__title {
  font-family: var(--font-sans);
  font-weight: 600;

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef } = React;

function Header({ current = "work", onNavigate }) {
  const [scrolled, setScrolled] = useState(false);
  useEffect(() => {
    const onScroll = () => setScrolled(window.scrollY > 8);
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  const items = ["work", "services", "studio", "\n"];

  return (
    <header className={`fp-header ${scrolled ? "is-scrolled" : ""}`}>
      <div className="fp-header__inner">
        <a className="fp-lockup" href="#top" onClick={(e) => { e.preventDefault(); onNavigate?.("top"); }}>
          floating<span className="fp-lockup__dot">.</span>
        </a>
        <nav className="fp-nav">
          {items.map((it) => (
            <a
              key={it}
              href={`#${it}`}
              className={`fp-nav__link ${current === it ? "is-current" : ""}`}
              onClick={(e) => { e.preventDefault(); onNavigate?.(it); }}
            >
              {it}
            </a>
          ))}
        </nav>
        <a
          href="#contact"
          className="fp-cta"
          onClick={(e) => { e.preventDefault(); onNavigate?.("contact"); }}
        >
          request a brief →
        </a>
      </div>
    </header>
  );
}

window.Header = Header;
</script>

<script type="text/babel" data-presets="react">
function simulateBounce(name, SCALE) {
  const o = {
    holdBefore: 0.25,
    fadeInDur: 0.18,
    shortAntDur: 0.12,
    finalAntDur: 0.36,
    anticipationSquashY: 0.42,
    startX: -640 * SCALE,
    startY: -200 * SCALE,
    launchVx: 490 * SCALE,
    gravity: 2800 * SCALE,
    restitution: 0.78,
    friction: 0.78,
    fps: 60,
    maxBounces: 4,
    settleThreshold: 80 * SCALE,
    impactSquashFloor: 0.5,
    stretchPerVel: 0.00055 / SCALE,
    impactSquashCoef: 0.00045 / SCALE,
    settleDur: 0.3,
    holdAfter: 0.0,
  };

  const samples = [];
  let t = 0;
  samples.push({ t: 0, x: o.startX, y: o.startY, sx: 1, sy: 1, op: 0 });
  samples.push({ t: o.holdBefore - 0.001, x: o.startX, y: o.startY, sx: 1, sy: 1, op: 0 });
  t = o.holdBefore;

  const dt = 1 / o.fps;
  let x = o.startX, y = o.startY, vx = o.launchVx, vy = 0;
  let bounces = 0, done = false;

  while (!done && t < 12) {
    vy += o.gravity * dt;
    x += vx * dt;
    y += vy * dt;

    if (y >= 0) {
      y = 0;
      const impactSpeed = Math.abs(vy);
      const sy_imp = Math.max(o.impactSquashFloor, 1 - impactSpeed * o.impactSquashCoef);
      const sx_imp = 1 + (1 - sy_imp) * 0.7;
      samples.push({ t, x, y: 0, sx: sx_imp, sy: sy_imp, impact: true });

      vy = -impactSpeed * o.restitution;
      vx *= o.friction;
      bounces++;

      if (Math.abs(vy) < o.settleThreshold || bounces >= o.maxBounces) {
        done = true;
        continue;
      }

      const isFinalWindup = (bounces === o.maxBounces - 1);
      const antDur = isFinalWindup ? o.finalAntDur : o.shortAntDur;
      const deepSquash = Math.max(o.anticipationSquashY, sy_imp - (isFinalWindup ? 0.12 : 0.05));
      const antFrames = Math.round(antDur * o.fps);
      for (let ii = 1; ii <= antFrames; ii++) {
        const uu = ii / antFrames;
        const ee = isFinalWindup
          ? uu * uu
          : (uu < 0.5 ? 4 * uu * uu * uu : 1 - Math.pow(-2 * uu + 2, 3) / 2);
        const sy_a = sy_imp + (deepSquash - sy_imp) * ee;
        const sx_a = 1 + (1 - sy_a) * 0.7;
        samples.push({ t: t + antDur * uu, x, y: 0, sx: sx_a, sy: sy_a });
      }
      t += antDur;

      samples.push({ t, x, y: 0, sx: 0.85, sy: 1.18, impact: true });
      continue;
    }

    const spd = Math.abs(vy);
    const sy_f = 1 + spd * o.stretchPerVel;
    const sx_f = 2 - sy_f;
    samples.push({ t, x, y, sx: sx_f, sy: sy_f });
    t += dt;
  }

  const last = samples[samples.length - 1];
  const startSx = last.sx, startSy = last.sy, startXSettle = last.x;
  const settleFrames = Math.round(o.settleDur * o.fps);
  for (let j = 1; j <= settleFrames; j++) {
    const u2 = j / settleFrames;
    const e2 = 1 - Math.pow(1 - u2, 3);
    samples.push({
      t: t + o.settleDur * u2,
      x: startXSettle * (1 - e2),
      y: 0,
      sx: startSx + (1 - startSx) * e2,
      sy: startSy + (1 - startSy) * e2,
    });
  }
  t += o.settleDur;
  samples.push({ t, x: 0, y: 0, sx: 1, sy: 1 });

  const duration = samples[samples.length - 1].t;
  const stride = 2;
  const fadeEnd = o.holdBefore + o.fadeInDur;
  const lines = [];
  for (let k = 0; k < samples.length; k++) {
    if (k !== 0 && k !== samples.length - 1 && k % stride !== 0 && !samples[k].impact) continue;
    const s = samples[k];
    const pct = ((s.t / duration) * 100).toFixed(2);
    const op = (s.op !== undefined) ? s.op
      : (s.t >= fadeEnd ? 1 : Math.max(0, (s.t - o.holdBefore) / o.fadeInDur));
    lines.push(`${pct}% { opacity: ${op.toFixed(2)}; transform: translate(${s.x.toFixed(1)}px, ${s.y.toFixed(1)}px) scale(${s.sx.toFixed(3)}, ${s.sy.toFixed(3)}); }`);
  }
  return {
    keyframes: `@keyframes ${name} {\n  ${lines.join("\n  ")}\n}`,
    duration,
  };
}

function Hero() {
  const headlineRef = useRef(null);
  const styleRef = useRef(null);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    const h1 = headlineRef.current;
    if (!h1) return;
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const FS = parseFloat(getComputedStyle(h1).fontSize) || 96;
    const SCALE = FS / 160;

    const id = `fp-hero-bounce-${Math.random().toString(36).slice(2, 8)}`;
    const sim = simulateBounce(id, SCALE);

    const css = `
      ${sim.keyframes}
      .fp-hero__period-bouncer {
        width: ${(33 * SCALE).toFixed(2)}px;
        height: ${(33 * SCALE).toFixed(2)}px;
        margin-left: ${(9 * SCALE).toFixed(2)}px;
        opacity: 0;
        transform: translate(${(-640 * SCALE).toFixed(1)}px, ${(-200 * SCALE).toFixed(1)}px);
        ${reduced ? "" : `animation: ${id} ${sim.duration.toFixed(2)}s linear 1 forwards;`}
      }
      ${reduced ? `.fp-hero__period-bouncer { opacity: 1; transform: none; }` : ""}
    `;
    const style = document.createElement("style");
    style.textContent = css;
    document.head.appendChild(style);
    styleRef.current = style;
    setReady(true);
    return () => { style.remove(); };
  }, []);

  return (
    <section className="fp-hero" id="top">
      <div className="fp-hero__util">engineering solutions · est. 2026</div>
      <h1 className="fp-hero__headline" ref={headlineRef}>
        <span className="fp-hero__lockup">
          <span className="fp-hero__word">floating</span>
          <span className="fp-hero__period-bouncer" aria-hidden="true" />
        </span>
      </h1>
      <p className="fp-hero__lead">
        engineering that lands where you put it. tight-tolerance systems for teams that don't accept drift. predictable cost. predictable timelines.
      </p>
      <div className="fp-hero__actions">
        <a className="fp-cta" href="#contact">request a brief →</a>
        <a className="fp-link" href="#work">see selected work →</a>
      </div>
    </section>
  );
}

window.Hero = Hero;
</script>
